<mat-card>
  <mat-card-header>
    <mat-card-title>Order aanmaken</mat-card-title>
    <mat-card-subtitle>POST /api/orders</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Bedrag (€)</mat-label>
        <input matInput type="number" formControlName="amount"
               data-testid="order-amount" placeholder="49.95" step="0.01" min="0.01" />
        <mat-error *ngIf="form.get('amount')?.invalid">Voer een geldig bedrag in</mat-error>
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit"
              data-testid="submit-order" [disabled]="isLoading || form.invalid">
        @if (isLoading) { <mat-spinner diameter="18" /> } @else { Maak order aan }
      </button>
    </form>
  </mat-card-content>

  @if (result) {
    <mat-card-content class="result">
      <p><strong>Order ID:</strong> <span data-testid="created-order-id">{{ result.orderId }}</span></p>
      <p><strong>Status:</strong>
        <span data-testid="created-order-status"
              [class.approved]="result.approved" [class.rejected]="!result.approved">
          {{ result.paymentStatus }}
        </span>
      </p>
    </mat-card-content>
  }

  @if (errorMessage) {
    <mat-card-content>
      <p class="error" data-testid="order-form-error">{{ errorMessage }}</p>
    </mat-card-content>
  }

  <mat-card-actions>
    <a mat-button routerLink="lookup">Order opzoeken →</a>
  </mat-card-actions>
</mat-card>
