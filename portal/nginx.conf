server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker interne DNS — lost hostnames op bij request-time, niet bij startup
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/orders {
        set $upstream http://order:8080;
        proxy_pass $upstream;
    }
    location /api/payments {
        set $upstream http://payment-backend:8081;
        proxy_pass $upstream;
    }
    location /api/notifications {
        set $upstream http://notification:8082;
        proxy_pass $upstream;
    }

    location / { try_files $uri $uri/ /index.html; }
}
