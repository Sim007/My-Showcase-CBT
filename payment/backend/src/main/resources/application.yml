server:
  port: 8081

soap:
  provider:
    url: http://wiremock:8080/soap/payment

notification:
  service:
    url: http://notification:8082

spring:
  application:
    name: payment-service
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

# Zelfverklaring (onderdeel 1): waarden komen via Maven resource filtering
# (@-delimiters, zie pom.xml) uit de contracts.*-properties — geen hardcoded
# duplicatie. Zelfde waarden staan als OCI-labels op de Dockerfile.
info:
  contracts:
    serves:
      order-payment: "@contracts.serves.order-payment@"
      payment-notification: "@contracts.serves.payment-notification@"
    consumes:
      payment-external: "@contracts.consumes.payment-external@"
      payment-notification-rest: "@contracts.consumes.payment-notification-rest@"
