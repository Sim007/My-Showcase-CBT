server:
  port: 8081

soap:
  provider:
    url: http://wiremock:8080/soap/payment

notification:
  service:
    url: http://notification:8082

# Onderdeel 2, springdoc-drift-check: genereer OAS 3.0 (niet springdoc's 3.1-default) — sluit
# aan bij de gepubliceerde spec (contracts/order-payment/1.0.0/openapi.yaml is 3.0.3) en
# vermijdt een bekende springdoc/swagger-core-crash op JDK 21 in het OAS-3.1-modelconversiepad
# (PolymorphicModelConverter zoekt javax.xml.bind, dat niet meer op de JDK-classpath zit).
springdoc:
  api-docs:
    version: OPENAPI_3_0

spring:
  application:
    name: payment-service
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

# Zelfverklaring (onderdeel 1): waarden komen via Maven resource filtering
# (@-delimiters, zie pom.xml) uit de contracts.*-properties — geen hardcoded
# duplicatie. Zelfde waarden staan als OCI-labels op de Dockerfile.
info:
  contracts:
    serves:
      order-payment: "@contracts.serves.order-payment@"
      payment-notification: "@contracts.serves.payment-notification@"
    consumes:
      payment-external: "@contracts.consumes.payment-external@"
      payment-notification-rest: "@contracts.consumes.payment-notification-rest@"
