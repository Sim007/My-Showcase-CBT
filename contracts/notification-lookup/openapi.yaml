openapi: "3.0.3"
info:
  title: Notification Lookup API
  description: Contract voor het opzoeken van notificaties op orderId (Angular → Notification service)
  version: "1.0.0"

servers:
  - url: http://localhost:8082

paths:
  /api/notifications:
    get:
      summary: Haal notificaties op voor een order
      operationId: getNotifications
      parameters:
        - name: orderId
          in: query
          required: true
          schema:
            type: string
          example: "order-abc123"
      responses:
        '200':
          description: Lijst van notificaties (leeg als geen gevonden)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationResponse'

components:
  schemas:
    NotificationResponse:
      type: object
      required: [notificationId, orderId, type, message, timestamp]
      properties:
        notificationId:
          type: string
          example: "notif-001"
        orderId:
          type: string
          example: "order-abc123"
        type:
          type: string
          enum: [PAYMENT_APPROVED, PAYMENT_REJECTED]
          example: "PAYMENT_APPROVED"
        message:
          type: string
          example: "Betaling voor order order-abc123 is goedgekeurd"
        timestamp:
          type: string
          format: date-time
          example: "2026-05-08T10:00:00Z"
