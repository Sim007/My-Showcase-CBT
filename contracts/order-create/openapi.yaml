openapi: "3.0.3"
info:
  title: Order Create API
  description: Contract voor het aanmaken van een order (Angular → Order service)
  version: "1.0.0"

servers:
  - url: http://localhost:8080

paths:
  /api/orders:
    post:
      summary: Maak een nieuwe order aan
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '200':
          description: Order aangemaakt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Ongeldig bedrag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    CreateOrderRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          format: double
          minimum: 0.01
          example: 49.95

    OrderResponse:
      type: object
      required: [orderId, amount, paymentStatus, approved]
      properties:
        orderId:
          type: string
          example: "order-abc123"
        amount:
          type: number
          format: double
          example: 49.95
        paymentStatus:
          type: string
          enum: [APPROVED, REJECTED]
          example: "APPROVED"
        approved:
          type: boolean
          example: true

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
