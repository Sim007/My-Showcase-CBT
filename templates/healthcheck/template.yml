# GitLab CI/CD Component — referentie-implementatie, draait niet in deze
# GitHub-gehoste repo. Spiegelt de parametersignatuur van ci/healthcheck.sh.
# Script zelf is nog een placeholder (onderdeel 6) — deze component ook.

spec:
  inputs:
    boundary:
      description: "Naam van de grens, of leeg voor alle grenzen"
      default: ""
    report_only:
      type: boolean
      default: false
---

healthcheck:
  stage: deployment-healthcheck
  script:
    - |
      ARGS=""
      [ -n "$[[ inputs.boundary ]]" ] && ARGS="--boundary $[[ inputs.boundary ]]"
      if [ "$[[ inputs.report_only ]]" = "true" ]; then ARGS="$ARGS --report-only"; fi
      ./ci/healthcheck.sh $ARGS
