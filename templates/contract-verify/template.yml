# GitLab CI/CD Component — referentie-implementatie, draait niet in deze
# GitHub-gehoste repo. Spiegelt de parametersignatuur van het inmiddels
# functionele ci/contract-verify.sh (order-payment en payment-notification
# beide kanten uit onderdeel 2-3, payment-external consumerkant uit
# onderdeel 4).

spec:
  inputs:
    contract:
      description: "Naam van het contract onder contracts/"
    side:
      description: "provider of consumer"
---

contract-verify:
  stage: contract-verify
  script:
    - ./ci/contract-verify.sh --contract "$[[ inputs.contract ]]" --side "$[[ inputs.side ]]"
