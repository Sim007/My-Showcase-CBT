name: Notification Service – Build & Test

on:
  push:
    paths:
      - 'notification/**'
      - 'contracts/payment-notification/**'
  pull_request:
    paths:
      - 'notification/**'
      - 'contracts/payment-notification/**'

jobs:
  build:
    name: Build Notification service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build en unit tests
        working-directory: notification/backend
        run: mvn verify

      - name: Docker image bouwen
        working-directory: notification/backend
        run: docker build -t showcase/notification:${{ github.sha }} .
