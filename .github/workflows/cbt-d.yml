name: CBT-D – Contract Tests

on:
  workflow_dispatch:

jobs:
  contract-tests:
    name: Contract tests (alle typen)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start infrastructure (RabbitMQ + WireMock + services)
        working-directory: CBT-D
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d \
            rabbitmq wiremock order payment-backend notification

      - name: Installeer Playwright
        working-directory: CBT-D/tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Contract tests (type 0–3)
        working-directory: CBT-D/tests
        run: npx playwright test --grep "Contract"
        env:
          ORDER_URL: http://localhost:8080
          PAYMENT_URL: http://localhost:8081
          NOTIFICATION_URL: http://localhost:8082
          WIREMOCK_URL: http://localhost:8083

      - name: Upload Playwright rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: CBT-D/tests/playwright-report/

      - name: Stop services
        if: always()
        working-directory: CBT-D
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down
