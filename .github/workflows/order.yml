name: Order Service – Build & Test

on:
  push:
    paths:
      - 'order/**'
      - 'contracts/order-payment/**'
  pull_request:
    paths:
      - 'order/**'
      - 'contracts/order-payment/**'

jobs:
  build:
    name: Build Order service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build en unit tests
        working-directory: order/backend
        run: mvn verify

      - name: Docker image bouwen
        working-directory: order/backend
        run: docker build -t showcase/order:${{ github.sha }} .
