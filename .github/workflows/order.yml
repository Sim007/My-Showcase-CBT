name: Order Service – Squad Pipeline

on:
  push:
    paths:
      - 'order/**'
      - 'contracts/order-payment/**'
      - 'ci/**'
  pull_request:
    paths:
      - 'order/**'
      - 'contracts/order-payment/**'
      - 'ci/**'

jobs:
  pipeline:
    name: Order squad-pipeline
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: build
        working-directory: order/backend
        run: mvn -DskipTests package

      - name: unit
        working-directory: order/backend
        run: mvn test

      - name: contractverificatie
        run: ./ci/contract-verify.sh --contract order-payment --side consumer

      - name: docker build
        run: ./ci/docker-build.sh --service order --context order/backend --tag ${{ github.sha }}

      - name: compose up (ci-profiel order)
        working-directory: CBT-D
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile order up -d --build

      - name: healthcheck
        run: ./ci/healthcheck.sh --boundary order-payment

      - name: keten-smoke
        run: ./ci/smoke.sh --boundary order-payment

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: playwright-scenario's
        working-directory: CBT-D/tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test intern/order-lookup-contract.spec.ts intern/order-create-contract.spec.ts rest/order-payment.spec.ts
        env:
          ORDER_URL: http://localhost:8080
          PAYMENT_URL: http://localhost:8081

      - name: Upload Playwright rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-order
          path: CBT-D/tests/playwright-report/

      - name: compose down
        if: always()
        working-directory: CBT-D
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml --profile order down --remove-orphans
