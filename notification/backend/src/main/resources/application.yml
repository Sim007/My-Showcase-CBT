server:
  port: 8082

spring:
  application:
    name: notification-service
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

# Zelfverklaring (onderdeel 1): waarden komen via Maven resource filtering
# (@-delimiters, zie pom.xml) uit de contracts.*-properties — geen hardcoded
# duplicatie. Zelfde waarden staan als OCI-labels op de Dockerfile.
info:
  contracts:
    serves:
      notification-lookup: "@contracts.serves.notification-lookup@"
      payment-notification-rest: "@contracts.serves.payment-notification-rest@"
    consumes:
      payment-notification: "@contracts.consumes.payment-notification@"
