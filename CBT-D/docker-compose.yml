services:

  # profiles: gedeelde infra staat aan zodra minstens één deelsysteem-profiel
  # actief is — CI-profiel per deelsysteem (onderdeel 0). Standaard lokaal
  # opstarten (start.sh/sts.sh) gebruikt profiel "local", dat alles omvat.
  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    profiles: ["local", "order", "payment", "notification"]
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  wiremock:
    image: wiremock/wiremock:3.13.2
    profiles: ["local", "order", "payment", "notification"]
    ports:
      - "8083:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings
    command: ["--global-response-templating", "--verbose"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/__admin/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Order squad ────────────────────────────────────
  order:
    build:
      context: ../order/backend
    profiles: ["local", "order"]
    ports:
      - "8080:8080"
    environment:
      - PAYMENT_SERVICE_URL=http://payment-backend:8081
    depends_on:
      rabbitmq:
        condition: service_healthy
      payment-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15

  mf-order:
    build:
      context: ../order/frontend
    profiles: ["local"]
    ports:
      - "4201:8080"

  # ── Payment squad ───────────────────────────────────
  # Staat ook aan in profiel "order" en "notification": beide pipelines
  # hebben Payment nu nog als échte dependency nodig om hun eigen grens te
  # bewijzen (geen WireMock-stub — die volgt in onderdeel 2, zonder dit
  # profiel-mechanisme te wijzigen).
  payment-backend:
    build:
      context: ../payment/backend
    profiles: ["local", "payment", "order", "notification"]
    ports:
      - "8081:8081"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SOAP_PROVIDER_URL=http://wiremock:8080/soap/payment
      - NOTIFICATION_SERVICE_URL=http://notification:8082
    depends_on:
      rabbitmq:
        condition: service_healthy
      wiremock:
        condition: service_healthy
      notification:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15

  mf-payments:
    build:
      context: ../payment/frontend
    profiles: ["local"]
    ports:
      - "4202:8080"

  # ── Notification squad ──────────────────────────────
  # Staat ook aan in "order" en "payment": beide roepen Notification nu nog
  # als échte dependency aan (REST en async) om hun eigen grens te bewijzen.
  notification:
    build:
      context: ../notification/backend
    profiles: ["local", "payment", "notification", "order"]
    ports:
      - "8082:8082"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15

  mf-notifications:
    build:
      context: ../notification/frontend
    profiles: ["local"]
    ports:
      - "4203:8080"

  # ── Platform squad (portal) ─────────────────────────
  portal-shell:
    build:
      context: ../portal
    profiles: ["local"]
    ports:
      - "4200:8080"
    depends_on:
      - mf-order
      - mf-payments
      - mf-notifications
      - order
      - payment-backend
      - notification
