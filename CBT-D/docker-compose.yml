services:

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  wiremock:
    image: wiremock/wiremock:3.13.2
    ports:
      - "8083:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings
    command: ["--global-response-templating", "--verbose"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/__admin/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Order squad ────────────────────────────────────
  order:
    build:
      context: ../order/backend
    ports:
      - "8080:8080"
    environment:
      - PAYMENT_SERVICE_URL=http://payment-backend:8081
    depends_on:
      rabbitmq:
        condition: service_healthy
      payment-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15

  mf-order:
    build:
      context: ../order/frontend
    ports:
      - "4201:8080"

  # ── Payment squad ───────────────────────────────────
  payment-backend:
    build:
      context: ../payment/backend
    ports:
      - "8081:8081"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SOAP_PROVIDER_URL=http://wiremock:8080/soap/payment
      - NOTIFICATION_SERVICE_URL=http://notification:8082
    depends_on:
      rabbitmq:
        condition: service_healthy
      wiremock:
        condition: service_healthy
      notification:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15

  mf-payments:
    build:
      context: ../payment/frontend
    ports:
      - "4202:8080"

  # ── Notification squad ──────────────────────────────
  notification:
    build:
      context: ../notification/backend
    ports:
      - "8082:8082"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15

  mf-notifications:
    build:
      context: ../notification/frontend
    ports:
      - "4203:8080"

  # ── Platform squad (portal) ─────────────────────────
  portal-shell:
    build:
      context: ../portal
    ports:
      - "4200:8080"
    depends_on:
      - mf-order
      - mf-payments
      - mf-notifications
      - order
      - payment-backend
      - notification
